_target_: pangaea.datasets.dcc.DCC
dataset_name: DCC
root_path: ../data/dataset
download_url: null
auto_download: false

img_size: 256
multi_temporal: False
multi_modal: False

# classes
ignore_index: -1
num_classes: 2
classes:
  - Background
  - Building
distribution:
  - 0.8
  - 0.2

# data stats
bands:
  optical:
    - B4  # Band 1 (Red)
    - B3  # Band 2 (Green)
    - B2  # Band 3 (Blue)
data_mean:
  optical:
    - 85.40113878
    - 101.66020325
    - 74.62796492
data_std:
  optical:
    - 52.56720269
    - 42.86468953
    - 45.01710218
data_min:
  optical: [0.0, 0.0, 0.0]
data_max:
  optical: [255, 255, 255]
